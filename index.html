<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e8b57">
<title>Catalog EFS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e8b57'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='22' fill='white' text-anchor='middle'%3EEFS%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --card2:#f7faf8; --ink:#17201b; --muted:#5b6a62; --line:#dde5e0;
  --green:#2e8b57; --green-d:#23704a; --green-l:#e2f2e8; --on-green:#fff;
  --orange:#d9681f; --orange-l:#fdece0; --red:#c23b32; --red-l:#fbe5e3;
  --blue:#2a66a8; --blue-l:#e5eef8; --pink:#a8417f; --yellow-l:#fff6d6; --yellow:#8a6a00;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
  --radius:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --card:#18201c; --card2:#1d2621; --ink:#e8efea; --muted:#9aaba2; --line:#2a352f;
    --green:#3fae6f; --green-d:#6cc893; --green-l:#1d3326; --on-green:#07150d;
    --orange:#f08a45; --orange-l:#3a2618; --red:#ef6b61; --red-l:#3a1d1b;
    --blue:#6ea6e6; --blue-l:#182a3d; --pink:#e07ab6; --yellow-l:#3a3214; --yellow:#e8c75a;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --card:#18201c; --card2:#1d2621; --ink:#e8efea; --muted:#9aaba2; --line:#2a352f;
  --green:#3fae6f; --green-d:#6cc893; --green-l:#1d3326; --on-green:#07150d;
  --orange:#f08a45; --orange-l:#3a2618; --red:#ef6b61; --red-l:#3a1d1b;
  --blue:#6ea6e6; --blue-l:#182a3d; --pink:#e07ab6; --yellow-l:#3a3214; --yellow:#e8c75a;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-d)}

/* ---------- bara de sus ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.logo i{display:grid;place-items:center;width:36px;height:32px;border-radius:9px;background:var(--green);color:var(--on-green);font-style:normal;font-size:.8rem;letter-spacing:-.02em}
.ctx{display:flex;gap:6px;margin-left:auto;min-width:0}
.ctx select{max-width:48vw;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:.88rem;min-width:0}
.topnav{display:none;gap:4px;margin-left:12px}
.topnav a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
.topnav a.on{background:var(--green-l);color:var(--green-d)}

/* ---------- meniul de jos (telefon) ---------- */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.botnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
.botnav a b{font-size:1.35rem;line-height:1;font-weight:400}
.botnav a.on{color:var(--green-d)}
.botnav a.on b{background:var(--green-l);border-radius:999px;padding:3px 16px}
main{max-width:1200px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 30px)}
@media (min-width:900px){
  .topnav{display:flex}
  .botnav{display:none}
  main{padding:20px 20px 60px}
  .ctx select{max-width:260px}
}

/* ---------- elemente comune ---------- */
h1{font-size:1.45rem;margin:4px 0 2px;line-height:1.2}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:1rem;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer;background:var(--green);color:var(--on-green);text-decoration:none;font-size:.95rem;min-height:42px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--green-d);border:1.5px solid var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--orange);color:#fff}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem;border-radius:8px}
.btn.big{padding:14px 18px;font-size:1.05rem;min-height:52px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;min-height:40px;cursor:pointer;font-size:1.05rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi .v{font-size:1.6rem;font-weight:800;line-height:1.2;margin:2px 0}
.kpi .s{font-size:.78rem;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.92rem;background:var(--blue-l);border:1px solid transparent}
.alert.warn{background:var(--yellow-l);color:var(--ink)}
.alert.bad{background:var(--red-l)}
.alert .t{flex:1}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-flex;align-items:center;gap:2px;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 7px;white-space:nowrap}
.b-scut{background:var(--blue-l);color:var(--blue)}
.b-part{background:var(--yellow-l);color:var(--yellow)}
.b-perf{background:var(--orange-l);color:var(--orange)}
.b-ab{background:var(--red-l);color:var(--red)}
.b-ok{background:var(--green-l);color:var(--green-d)}
.gen{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:800;font-size:.85rem;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.gen.B{color:var(--blue);border-color:var(--blue)}
.gen.F{color:var(--pink);border-color:var(--pink)}
.gen.U{color:var(--red);border-color:var(--red);background:var(--red-l)}

/* ---------- formulare ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea,.inp{font-size:1rem;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:400;width:100%}
label.f textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:600px){.grid2{grid-template-columns:1fr 1fr}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}}
.radio{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.radio label{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:.95rem}
.radio label:has(input:checked){border-color:var(--green);background:var(--green-l)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--green)}
input[type=checkbox]{accent-color:var(--green)}

/* ---------- liste ---------- */
.list{list-style:none;margin:0;padding:0}
.list > li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.list > li:last-child{border-bottom:0}
.list > li.click{cursor:pointer}
.list .nr{width:26px;color:var(--muted);font-size:.85rem;text-align:right;flex:none}
.list .nm{flex:1;min-width:0;font-weight:600}
.list .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.list .right{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.classcards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.classcards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.classcards{grid-template-columns:repeat(3,1fr)}}
.classcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.classcard .t{font-weight:800;font-size:1.15rem}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--green);border-radius:999px}

/* ---------- tabele ---------- */
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:.92rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
table.t th{background:var(--card2);font-size:.78rem;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:2}
table.t th.grp{font-size:.82rem;color:var(--ink);white-space:normal;min-width:80px}
table.t td.l,table.t th.l{text-align:left}
table.t .stick{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;min-width:170px;max-width:230px;white-space:normal}
table.t th.stick{z-index:3;background:var(--card2)}
th.gA{background:var(--orange-l)!important} th.gB{background:var(--blue-l)!important} th.gC{background:var(--green-l)!important}
td.calc{font-weight:700}
td.fin{font-weight:800;font-size:1.05rem;color:var(--orange)}
.low{color:var(--red)!important}
.up{color:var(--green-d);font-weight:700}.down{color:var(--red);font-weight:700}
input.n{width:58px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:6px 2px;background:var(--card);font-size:.95rem}
input.n.bad{border-color:var(--red);background:var(--red-l)}
input.n:disabled,select.n:disabled{opacity:.45}
select.n{border:1.5px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--card);font-size:.9rem}
tr.off td:not(.stick){opacity:.45}
.xbtn{border:1px dashed var(--line);background:none;border-radius:6px;font-size:.7rem;padding:1px 5px;cursor:pointer;color:var(--muted);display:block;margin:3px auto 0}
.xbtn.on{border-style:solid;border-color:var(--yellow);color:var(--yellow);background:var(--yellow-l)}
tfoot td{font-weight:700;background:var(--card2)}

/* ---------- ora / introducere rapidă ---------- */
.scards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:800px){.scards{grid-template-columns:1fr 1fr}}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.scard.abs{opacity:.55}
.scard .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.scard .hd .nm{flex:1;font-weight:700;min-width:0}
.grades{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grades button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);font-weight:800;font-size:1.05rem;cursor:pointer}
.grades button.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.absbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;cursor:pointer;min-height:36px}
.absbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.obs{font-size:.82rem;background:var(--yellow-l);border-radius:8px;padding:5px 8px;margin:-2px 0 8px}
.bigin{font-size:1.2rem;padding:10px;width:110px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.stickybar{position:sticky;bottom:calc(var(--nav-h) + 8px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.12);margin-top:12px}
@media (min-width:900px){.stickybar{bottom:12px}}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dlg-h h2{margin:0;flex:1;font-size:1.05rem}
.dlg-b{padding:14px 16px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:100;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:90vw}
.probebox{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.barem{display:grid;grid-template-columns:58px repeat(6,1fr);gap:4px;align-items:center;margin-top:6px}
.barem input{width:100%;text-align:center;padding:6px 2px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
.barem div{text-align:center;font-weight:700;font-size:.75rem}
.varrow{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.ablist{list-style:none;margin:0;padding:0}
.ablist li{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:10px;align-items:flex-start}
.ablist li.blue{border-left-color:var(--blue)}
.ablist li.yel{border-left-color:var(--yellow)}
.ablist .d{font-weight:700;min-width:84px;font-size:.9rem}
.ablist .tx{flex:1;font-size:.92rem}
.ablist .m{font-size:.82rem;color:var(--muted)}

/* ---------- printare ---------- */
#print{display:none}
@media print{
  body.printing > *:not(#print){display:none!important}
  body.printing #print{display:block;color:#000;background:#fff;font-size:11px}
  #print table{border-collapse:collapse;width:100%}
  #print th,#print td{border:1px solid #888;padding:3px 4px;text-align:center}
  #print td.l,#print th.l{text-align:left}
  #print h2{margin:0 0 4px;font-size:15px}
  @page{margin:10mm}
}

a.chip{text-decoration:none;color:inherit}
a.chip.on{color:var(--green-d)}
#selYear{flex:none;min-width:112px}
#selSchool{flex:1}
.ctx{flex:1;justify-content:flex-end}
@media (max-width:520px){ .logo span{display:none} table.t .stick{min-width:130px} }

.absbtn.inv.on{background:var(--yellow-l);border-color:var(--yellow);color:var(--yellow)}
.chip.sm{padding:4px 10px;font-size:.82rem;font-weight:500}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.qbtn{display:flex;flex-direction:column;gap:2px;justify-content:center;min-height:68px;padding:10px 14px;border-radius:var(--radius);background:var(--green);color:var(--on-green);text-decoration:none;box-shadow:var(--shadow)}
.qbtn b{font-size:1.1rem}
.qbtn small{opacity:.85;font-size:.78rem}
.qbtn.live{background:var(--orange);color:#fff}
.list > li.orar-cur{background:var(--green-l);border-radius:10px;padding-left:8px;padding-right:8px}
.slotrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px}
.slotrow .inp{min-width:0;padding:7px 6px}
.b-med{background:#9b1c31;color:#fff;font-size:.78rem;padding:2px 8px}
.b-medp{background:#e8a317;color:#1b1400;font-size:.78rem;padding:2px 8px}
.medx{font-style:normal;font-weight:900;font-size:1em;line-height:1}
.medx-big{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#9b1c31;color:#fff;font-weight:900;font-size:.95rem;line-height:1;flex:none}
.medx-txt{color:#c27c00;font-weight:900}
:root[data-theme="dark"] .b-med,:root[data-theme="dark"] .medx-big{background:#c23a52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-med,:root:not([data-theme="light"]) .medx-big{background:#c23a52}}
.list.stu > li.srow{display:block;padding:10px 2px}
.srow-h{display:flex;align-items:center;gap:8px}
.srow-h .nm{flex:1;min-width:0;font-weight:650;color:var(--ink);text-decoration:none}
.srow-h .arrow{min-width:38px;min-height:38px;font-size:1.05rem;flex:none}
.srow-h .arrow.on{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 70px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:650;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.p-ok{background:var(--green-l);border-color:transparent;color:var(--green-d)}
.pill.p-bad{background:var(--red-l);border-color:var(--red);color:var(--red)}
.pill.p-warn{background:var(--yellow-l);border-color:transparent;color:var(--yellow)}
.pill.p-med{background:#9b1c31;border-color:transparent;color:#fff}
.hist{margin:8px 0 2px 70px;border-left:3px solid var(--line);padding-left:10px}
.hrow{display:flex;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:.86rem;cursor:pointer;border-radius:6px}
.hrow:last-child{border-bottom:0}
.hrow:hover{background:var(--card2)}
.hrow .hd{font-weight:800;min-width:66px;color:var(--ink);flex:none}
.hrow .hi{flex:1;color:var(--ink)}
.t-bad{color:var(--red)} .t-warn{color:var(--yellow)}
@media (max-width:520px){ .pills,.hist{margin-left:0} }
.backbtn{display:inline-flex;align-items:center;gap:8px;max-width:100%;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;margin:0 0 8px;font-weight:650;font-size:.92rem;box-shadow:var(--shadow);min-height:40px}
.backbtn b{display:grid;place-items:center;width:32px;height:32px;border-radius:999px;background:var(--green);color:var(--on-green);font-size:1.1rem;line-height:1;flex:none}
.backbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backbtn:active{transform:translateY(1px)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;min-width:36px;min-height:36px;border-radius:8px}
.del:hover{color:var(--red);background:var(--red-l)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:4px 0 10px;background:var(--line)}
.stack i{display:block;height:100%}

/* ---------- import elevi din text ---------- */
function parseGen(t) {
  t = (t || "").trim().toLowerCase();
  if (/^(f|fată|fata|feminin|fem)$/.test(t)) return "F";
  if (/^(b|m|băiat|baiat|masculin|masc)$/.test(t)) return "B";
  return "U";
}
/* data: 12.03.2015, 12/03/2015, 12-03-2015, 12.03.15, 2015-03-12 → ISO */
function parseDate(t) {
  t = String(t || "").trim(); let d, m, y, x;
  if ((x = t.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/))) { y = +x[1]; m = +x[2]; d = +x[3]; }
  else if ((x = t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2}|\d{4})$/))) { d = +x[1]; m = +x[2]; y = +x[3]; if (y < 100) y += y < 50 ? 2000 : 1900; }
  else return null;
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d || y < 1990 || y > 2030) return null;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function parseStudents(text) {
  const out = [];
  String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/\t|;|,/).map(p => p.trim()).filter(Boolean); if (!parts.length) return;
    let name = parts[0].replace(/^\d+[\.\)]?\s+/, ""), g = "U", birth = "";
    parts.slice(1).forEach(p => { const dt = parseDate(p); if (dt) birth = dt; else if (g === "U") g = parseGen(p); });
    if (g === "U" && parts.length === 1) { const m = name.match(/^(.*\S)\s+[-–]?\s*\(?([BFMbfm])\)?$/); if (m) { name = m[1]; g = parseGen(m[2]); } }
    if (name) out.push({ name, g, birth });
  });
  return out;
}
function nameKey(n) { return String(n || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]+/g, " ").trim().split(" ").filter(Boolean).sort().join(" "); }
function matchStudent(list, name) {
  const k = nameKey(name); if (!k) return null;
  let hit = list.filter(s => nameKey(s.name) === k); if (hit.length === 1) return hit[0];
  const kt = k.split(" ");
  hit = list.filter(s => { const st = nameKey(s.name).split(" "); return kt.every(t => st.includes(t)) || st.every(t => kt.includes(t)); });
  return hit.length === 1 ? hit[0] : null;
}

/* ---------- ora: prezență + nota C (în pagina clasei) ---------- */

  let l = S.lessons.find(x => x.classId === cid && x.date === todayISO());
  if (!l) {
    const fd = freeDayOf(todayISO()), vac = inVacation(todayISO());
    if ((fd || vac) && !noAsk && !confirmBox(`Azi este ${fd ? `zi liberă (${fd.name || "fără denumire"})` : "vacanță"}. Începi totuși lecția?`)) return null;
    l = { id: uid(), classId: cid, evalId: null, date: todayISO(), absent: {}, c: {}, motiv: {}, cards: {}, nl: {}, v: 2 };
    syncLessonEval(l); S.lessons.push(l); save();

}
ACT.startLesson = el => { const cid = el.dataset.c, l = todayLesson(cid); if (l) go(`#/clasa/${cid}/ora/${l.id}`); };
function lessonHasData(l) { return l.ok || Object.keys(l.absent || {}).length || Object.values(l.c || {}).some(x => num(x) !== null) || Object.values(l.cards || {}).some(a => a && a.length) || Object.values(l.nl || {}).some(a => a && a.length); }
function pruneEmptyLessons() {
  const r = route(), keep = r[0] === "clasa" && r[2] === "ora" ? [r[3]] : r[0] === "grup" ? String(r[1] || "").split(",") : [];
  const n = S.lessons.length;

</div>

function oraCard(s, l, e, locked) {

function rapidCard(e, s, cur) {

  else input = `<input class="bigin" data-rin inputmode="decimal" value="${esc(res[cur.f])}" ${dis ? "disabled" : ""} placeholder="${p && p.unit ? esc(p.unit) : ""}">`;

    ${input}${p && !p.optional && !scut && !res.x && hasPartial(s) ? `<button class="xbtn" data-rx ${dis ? "disabled" : ""} style="margin:8px 0 0">marchează „adaptat” – proba nu se aplică</button>` : ""}</div>`;

function bindRapid(e, cur) {
  const p = cur.p;
  $$(".scard[data-sid]").forEach(card => {
    const s = stu(card.dataset.sid);
    const redraw = () => { card.outerHTML = rapidCard(e, s, cur); bindRapid(e, cur); };
    const inp = $("[data-rin]", card);
    const xk = cur.f === "b" || cur.f === "c" ? cur.f : "";
    if (inp && xk) { // B / C: fiecare valoare introdusă devine o notă nouă
      const commit = () => { const v = inp.value.trim(); if (v === "") { inp.style.borderColor = ""; return; } if (!validVal("b", v)) { inp.style.borderColor = "var(--red)"; return; } inp.value = ""; inp.style.borderColor = ""; addNote(e, s, xk, v); };
      inp.addEventListener("input", () => { const v = inp.value.trim(); inp.style.borderColor = v === "" || validVal("b", v) ? "" : "var(--red)"; });
      inp.addEventListener("change", commit);
    }
    if (inp && !xk) {
      inp.addEventListener("input", () => {
        const v = inp.value.trim(), ok = validVal(cur.f, v, p); inp.style.borderColor = ok ? "" : "var(--red)";
        const d = edata(e, s.id);
        d.res[p.id] = d.res[p.id] || {}; d.res[p.id][cur.f] = ok ? v : ""; stamp(d.res[p.id], "d" + cur.f, d.res[p.id][cur.f]);
        save();
        const rn = $(".rnote", card);
        if (rn) { const n = probeNote(p, d.res[p.id], s.g); rn.textContent = n === null ? "" : fmtN(n); }
      });
    }
    if (inp) {
      inp.addEventListener("keydown", ev2 => {
        if (ev2.key !== "Enter") return; ev2.preventDefault();
        if (xk) { const v = inp.value.trim(); if (v !== "" && validVal("b", v)) { inp.value = ""; addNote(e, s, xk, v); } else if (v !== "") { inp.style.borderColor = "var(--red)"; return; } }
        const all = $$("[data-rin]:not(:disabled)"), i = all.indexOf(inp); if (all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); all[i + 1].scrollIntoView({ block: "center", behavior: "smooth" }); } else inp.blur();
      });
    }
    $$("[data-rx]", card).forEach(b => b.onclick = () => { const d = edata(e, s.id); d.res[p.id] = d.res[p.id] || {}; d.res[p.id].x = !d.res[p.id].x; save(); redraw(); });
    $$("[data-rv]", card).forEach(b => b.onclick = () => { const d = edata(e, s.id); d.res[p.id] = d.res[p.id] || {}; d.res[p.id].v = String(d.res[p.id].v) === b.dataset.rv ? "" : b.dataset.rv; stamp(d.res[p.id], "dv", d.res[p.id].v); save(); redraw(); });
    $$("[data-rg]", card).forEach(b => b.onclick = () => { const d = edata(e, s.id); d.res[p.id] = d.res[p.id] || {}; d.res[p.id].g = Math.max(0, (num(d.res[p.id].g) || 0) + +b.dataset.rg); if (d.res[p.id].v) d.res[p.id].dv = todayISO(); save(); redraw(); });
  });
}

/* ---------- copie de siguranță ---------- */
function backupBlob() { return new Blob([JSON.stringify({ app: "catalog-ef", v: 1, exported: new Date().toISOString(), state: S })], { type: "application/json" }); }
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
ACT.backup = async () => {
  const name = `catalog-EFS-copie-${todayISO()}.json`, blob = backupBlob();
  const mobile = window.matchMedia && matchMedia("(pointer:coarse)").matches;

    const file = new File([blob], name, { type: "application/json" });
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Copie de siguranță Catalog EFS" });
      S.settings.lastBackup = Date.now(); save(); render(); toast("Copia a fost trimisă."); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }

};
ACT.restore = () => pickBackup();
function pickBackup() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;

    r.readAsText(f);

}
function importData(obj) {

  }

/* import din catalogul HTML vechi */
function importOld(obj) {
  let scId = S.activeSchool;
  if (!scId) { const n = prompt("Numele școlii pentru clasele importate:", "Școala mea") || "Școala mea"; const sc = { id: uid(), name: n }; S.schools.push(sc); scId = S.activeSchool = sc.id; }
  if (!confirmBox(`Import ${obj.classes.length} clase din catalogul vechi în „${school(scId).name}”, anul ${S.activeYear}. Continui?`)) return;
  let ns = 0;
  obj.classes.forEach(oc => {
    const c = { id: uid(), schoolId: scId, year: S.activeYear, name: oc.name }; S.classes.push(c);
    const map = {};
    (oc.students || []).forEach(os => { const nid = uid(); const s = { id: nid, pid: nid, classId: c.id, name: os.name, g: os.g === "B" || os.g === "F" ? os.g : "U", birth: "", scutiri: [], abateri: (os.abateri || []).map(a => ({ id: uid(), date: a.date, text: a.text, mas: a.mas || "" })), perf: { on: false, sports: [], note: "" } }; map[os.id] = s; S.students.push(s); ns++; });
    (oc.evals || []).forEach((oe, ei) => {
      const e = { id: uid(), classId: c.id, name: oe.name, created: Date.now() + ei, weights: null, closed: false, snap: null, probes: [], data: {} };
      const pmap = {};
      (oe.probes || []).forEach(op => { const p = newProbe(op); pmap[op.id] = p.id; p.optional = false; e.probes.push(p); });
      Object.entries(oe.data || {}).forEach(([osid, od]) => {
        const s = map[osid]; if (!s) return;
        if (od.scutit && !s.scutiri.some(x => x.type === "an")) s.scutiri.push({ id: uid(), type: "an", from: "", to: "", docNr: "", docDate: "", emitent: "", obs: "Importat din catalogul vechi – verifică tipul scutirii" });
        const res = {}; Object.entries(od.res || {}).forEach(([opid, r]) => { if (pmap[opid]) res[pmap[opid]] = { i: r.i || "", r: r.r || "" }; });
        e.data[s.id] = { res, bs: num(od.b) !== null ? [{ v: String(od.b), d: "" }] : [] };
      });
      (oe.lessons || []).forEach((ol, li) => {
        const m = String(ol.date || "").match(/^(\d{1,2})\.(\d{1,2})/);
        let iso = todayISO();
        if (m) { const y0 = parseInt(S.activeYear, 10), mm = +m[2]; iso = `${mm >= 9 ? y0 : y0 + 1}-${String(mm).padStart(2, "0")}-${String(+m[1]).padStart(2, "0")}`; }
        const l = { id: uid(), classId: c.id, evalId: e.id, date: iso, absent: {}, c: {}, motiv: {} };
        Object.entries(oe.data || {}).forEach(([osid, od]) => { const s = map[osid]; if (s && od.c && num(od.c[ol.id]) !== null) l.c[s.id] = num(od.c[ol.id]); });
        S.lessons.push(l);
      });
      S.evals.push(e);
    });
  });
  save(); go("#/clase"); toast(`Am importat ${obj.classes.length} clase și ${ns} elevi.`, 4000);
}

/* ultima măsurătoare din anul acestei clase (pentru situația clasei) */
function latestBio(s) { const l = S.bio.filter(b => b.studentId === s.id).sort((a, b) => a.date.localeCompare(b.date)); return l[l.length - 1] || null; }
function ageText(birth, date) {
  const m = ageMonths(birth, date || todayISO()); if (m === null) return "";
  const y = Math.floor(m / 12), mo = Math.floor(m % 12);
  return `${y} ani${mo ? ` ${mo} ${mo === 1 ? "lună" : "luni"}` : ""}`;
}

function dezvCard(s, date, extras) {
  const b = S.bio.find(x => x.studentId === s.id && x.date === date) || { h: "", w: "", extra: {} };
  const i = bioCalc(s, b), prev = bioOf(s.id).filter(x => x.date < date).pop();
  const dh = prev && num(prev.h) !== null && num(b.h) !== null ? r2(num(b.h) - num(prev.h)) : null;
  return `<div class="scard" data-sid="${s.id}">
    <div class="hd"><span class="nm">${esc(s.name)} <span class="gen ${s.g === "B" || s.g === "F" ? s.g : "U"}" style="width:22px;height:22px;font-size:.72rem">${s.g === "B" || s.g === "F" ? s.g : "?"}</span>
      <small class="muted" style="display:block;font-weight:400">${s.birth ? ageText(s.birth, date) : `<a href="#/elev/${s.id}">adaugă data nașterii</a>`}</small></span>
      <span class="bioout small" style="text-align:right">${bioOut(i, dh)}</span></div>
    <div class="biorow">
      <label>Înălțime<input class="bigin sm" inputmode="decimal" data-bf="h" value="${esc(b.h)}" placeholder="cm"></label>
      <label>Greutate<input class="bigin sm" inputmode="decimal" data-bf="w" value="${esc(b.w)}" placeholder="kg"></label>
      ${extras.map((x, k) => `<label>${esc(x.replace(/\s*\(.*\)$/, ""))}<input class="bigin sm" inputmode="decimal" data-bx="${esc(x)}" value="${esc((b.extra || {})[x] || "")}" placeholder="${esc((x.match(/\((.*)\)/) || [])[1] || "")}"></label>`).join("")}
    </div></div>`;
}
function bioOut(i, dh) {
  if (!i.bmi) return dh !== null ? `<span class="muted">${dh > 0 ? "+" : ""}${fmtN(dh)} cm</span>` : "";
  return `IMC <b>${fmtN(i.bmi)}</b>${i.pct !== null ? `<br><span class="muted">P${pLab(i.pct)}</span>` : ""}${dh !== null ? `<br><span class="up">${dh > 0 ? "+" : ""}${fmtN(dh)} cm</span>` : ""}`;
}
function bindDezv(cid, date) {
  $$(".scard[data-sid]").forEach(card => {
    const s = stu(card.dataset.sid);
    $$("input", card).forEach(inp => {
      inp.addEventListener("input", () => {
        let b = S.bio.find(x => x.studentId === s.id && x.date === date);
        if (!b) { b = { id: uid(), studentId: s.id, date, h: "", w: "", extra: {} }; S.bio.push(b); }
        const v = inp.value.trim().replace(",", "."), ok = v === "" || (num(v) !== null && num(v) > 0 && num(v) < 300);
        inp.style.borderColor = ok ? "" : "var(--red)";
        if (inp.dataset.bf) b[inp.dataset.bf] = ok ? v : "";
        else { if (ok && v) b.extra[inp.dataset.bx] = v; else delete b.extra[inp.dataset.bx]; }
        if (!b.h && !b.w && !Object.keys(b.extra).length) S.bio = S.bio.filter(x => x !== b);
        save();
        const prev = bioOf(s.id).filter(x => x.date < date).pop();
        const dh = prev && num(prev.h) !== null && num(b.h) !== null ? r2(num(b.h) - num(prev.h)) : null;
        $(".bioout", card).innerHTML = bioOut(bioCalc(s, b), dh);
      });
      inp.addEventListener("keydown", e => {
        if (e.key !== "Enter") return; e.preventDefault();
        const all = $$(".scard input"), i = all.indexOf(inp), n = all[i + 1]; if (n) { n.focus(); n.select(); n.scrollIntoView({ block: "center", behavior: "smooth" }); } else inp.blur();
      });
    });
  });
}

/* ===================== STRUCTURA ANULUI ȘCOLAR + ÎNVOIRI REPETATE ===================== */
/* constantele sunt în const3.js (încărcat înaintea app.js) */

function normalize3(s) {
  const st = s.settings;
  st.invOn = st.invOn === true;
  st.yearMods = st.yearMods || {};
  Object.keys(DEFAULT_YEAR_MODS).forEach(y => { if (!Array.isArray(st.yearMods[y])) st.yearMods[y] = JSON.parse(JSON.stringify(DEFAULT_YEAR_MODS[y])); });
  const M = st.lists.motive || (st.lists.motive = []);
  if (st.invOn && !M.some(x => isInvMotiv(x))) M.push(INV_MOTIV);
  s.students.forEach(x => { x.docInv = Array.isArray(x.docInv) ? x.docInv : []; });
}

function normTxt(t) { return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
function isInvMotiv(t) { return normTxt(t).startsWith(normTxt(INV_MOTIV)); }
/* „Indispoziție de moment – durere de cap” → explicația */
function invExpl(t) { return String(t || "").slice(INV_MOTIV.length).replace(/^\s*[–\-:,]\s*/, "").trim(); }

/* modulele unui an școlar (listă de {from,to}) */
function yearMods(y) { return (S.settings.yearMods || {})[y] || []; }
/* în ce modul cade o dată: {y, i} (i = 0..4) sau null dacă anul nu are structura completată.
   Zilele din vacanță aparțin modulului care urmează. */
function modOf(iso) {
  const y = schoolYearOf(new Date(iso + "T12:00:00"));
  const mods = yearMods(y).map((m, i) => ({ ...m, i })).filter(m => m.from && m.to).sort((a, b) => a.to.localeCompare(b.to));
  if (!mods.length) return { y, i: null };
  for (const m of mods) if (iso <= m.to) return { y, i: m.i };
  return { y, i: mods[mods.length - 1].i };
}
function sameMod(a, b) { return a.y === b.y && a.i === b.i; }
function modName(m) { return m.i === null ? `anul școlar ${m.y}` : `Modulul ${ROMAN[m.i]}`; }

/* învoirile pentru indispoziție ale unui elev, cu modulul fiecăreia */
function invList(s) {
  return S.lessons.filter(l => l.classId === s.classId && attOf(l, s.id) === "i" && isInvMotiv((l.motiv || {})[s.id]))
    .map(l => ({ date: l.date, l, expl: invExpl(l.motiv[s.id]), m: modOf(l.date) }))
    .sort((a, b) => a.date.localeCompare(b.date));
}
/* situația în modulul datei iso: învoirile de după ultimul „Document primit” din același modul */
function invStatus(s, iso) {
  iso = iso || todayISO();
  const m = modOf(iso);

/* ---------- migrarea 4 ----------

function normalize4(s) {

const CARDS = {
  y: { v: 8, e: "🟨", l: "galben", c: "#d9a900" },
  o: { v: 6, e: "🟧", l: "portocaliu", c: "#e8730c" },

const LEGACY_CARD = { 8: "y", 6: "o", 4: "r" }; // notele C vechi care se văd ca un cartonaș
function lessonCards(l, sid) { return ((l.cards || {})[sid]) || []; }
/* Nota C a elevului la o oră, sau null dacă ora nu îi dă notă.
   Contează cel mai grav cartonaș (și nota veche, dacă există). Fără cartonaș: 10, doar la orele noi. */
function lessonC(l, s) {
  if (!l.evalId || attOf(l, s.id) || hasScutireAn(s) || !classGim(l.classId)) return null;
  const vals = lessonCards(l, s.id).map(c => CARDS[c.k] ? CARDS[c.k].v : null).filter(v => v !== null);
  const old = num(l.c[s.id]); if (old !== null) vals.push(old);
  if (vals.length) return Math.min(...vals);
  if (l.v !== 2) return null;
  const sc = scutireAt(s, l.date); if (sc && sc.type === "perioada") return null;
  return 10;
}
/* cartonașele unui elev la o evaluare (plus notele vechi 8/6/4, ca să se vadă la fel) */
function cardsOfEval(e, s) {

    lessonCards(l, s.id).forEach(c => out.push({ ...c, date: l.date, l }));

/* ---------- B: verificarea cunoștințelor (oral sau scris) ----------
   d.bs = [ { v: "8", d: "2026-11-15" } ] – notele B ale elevului la evaluare, cu data.

const XN = { b: "bs", c: "cs" }; // notele adăugate de mână: B în d.bs, C în d.cs

function cmList(d) { return xList(d, "c"); }

/* ===================== TRECEREA ÎN ANUL ȘCOLAR URMĂTOR ===================== */
function nextYearOf(y) { const a = parseInt(y, 10); return isNaN(a) ? y : `${a + 1}-${a + 2}`; }
const GRADES_RO = ["P", "I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
function bumpGrade(tok) { // clasa următoare sau null dacă absolvă
  const t = String(tok).toUpperCase();
  if (/^\d$/.test(t)) return +t >= 8 ? null : String(+t + 1);
  const i = GRADES_RO.indexOf(t); if (i < 0) return tok;
  return i >= 8 ? null : GRADES_RO[i + 1];
}
/* „a V-a A” → „a VI-a A”, „5B” → „6B”, „pregătitoare” → „clasa I”; a VIII-a absolvă */
function nextClassName(name) {
  name = String(name || "");
  if (/preg[ăa]titoare/i.test(name)) return { name: name.replace(/(clasa\s+)?preg[ăa]titoare/i, "clasa I"), grad: false };
  const re = /\ba\s+(VIII|VII|VI|IV|V|III|II|I)-a\b/g, all = [...name.matchAll(re)];
  if (all.length) {
    if (all.length === 1 && all[0][1] === "VIII") return { name, grad: true };
    return { name: name.replace(re, (m, r) => { const n = bumpGrade(r); return n ? `a ${n}-a` : m; }), grad: false };
  }
  const m = name.match(/^(.*?)(?<![A-Za-zĂÂÎȘȚăâîșț])(VIII|VII|VI|IV|V|III|II|I|[0-8])(?![IVX0-9a-zăâîșț])/);
  if (m) { const n = bumpGrade(m[2]); if (n === null) return { name, grad: true }; return { name: m[1] + n + name.slice(m[0].length), grad: false }; }
  return { name: name + " (anul următor)", grad: false };
}

/* ===================== GRAFICE DE DEZVOLTARE (curbele OMS 2007) ===================== */
const PCT_LINES = [[-1.881, "P3"], [-1.036, "P15"], [0, "P50"], [1.036, "P85"], [1.881, "P97"]];
/* valoarea de pe curba percentilei z: inversul formulei LMS */
function lmsVal(lms, z) { const [L, M, Sg] = lms; return Math.abs(L) < 1e-9 ? M * Math.exp(Sg * z) : M * Math.pow(1 + L * Sg * z, 1 / L); }
function niceStep(range) { const raw = range / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }
function growthChart(title, table, pts) {
  pts = pts.slice().sort((p, q) => p.m - q.m);
  let a = Math.max(60, Math.floor(pts[0].m / 12) * 12 - 12), b = Math.min(228, Math.ceil(pts[pts.length - 1].m / 12) * 12 + 12);
  if (b - a < 48) { b = Math.min(228, a + 48); a = Math.max(60, b - 48); }
  const ms = []; for (let m = a; m <= b; m += 2) ms.push(m);
  const curves = PCT_LINES.map(([z, l]) => ({ z, l, ys: ms.map(m => lmsVal(lmsAt(table, m), z)) }));
  let lo = Math.min(...curves[0].ys, ...pts.map(p => p.v)), hi = Math.max(...curves[4].ys, ...pts.map(p => p.v));
  const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  const W = 340, H = 220, L = 32, R = 30, T = 8, B = 24;
  const X = m => L + (m - a) / (b - a) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B), f1 = n => n.toFixed(1);
  const line = ys => ys.map((v, i) => `${i ? "L" : "M"}${f1(X(ms[i]))} ${f1(Y(v))}`).join(" ");
  const band = line(curves[1].ys) + " " + ms.map((m, i) => [m, curves[3].ys[i]]).reverse().map(([m, v]) => `L${f1(X(m))} ${f1(Y(v))}`).join(" ") + " Z";
  const st = niceStep(hi - lo), ticks = []; for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) ticks.push(v);
  const yrs = []; for (let m = Math.ceil(a / 12) * 12; m <= b; m += 12) yrs.push(m);
  let g = `<path d="${band}" fill="var(--green-l)"/>`;
  g += ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="var(--line)" stroke-width=".6"/><text x="${L - 4}" y="${f1(Y(v) + 3)}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtN(r2(v))}</text>`).join("");
  g += yrs.map(m => `<line x1="${f1(X(m))}" x2="${f1(X(m))}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width=".6"/><text x="${f1(X(m))}" y="${H - B + 11}" text-anchor="middle" font-size="9" fill="var(--muted)">${m / 12}</text>`).join("");
  g += `<text x="${W - R}" y="${H - 2}" text-anchor="end" font-size="9" fill="var(--muted)">vârsta (ani)</text><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="none" stroke="var(--line)"/>`;
  g += curves.map(c => `<path d="${line(c.ys)}" fill="none" stroke="${c.z === 0 ? "var(--green)" : "var(--muted)"}" stroke-width="${c.z === 0 ? 1.6 : 0.8}"${Math.abs(c.z) > 1.5 ? ' stroke-dasharray="3 3"' : ""} opacity="${c.z === 0 ? 1 : 0.7}"/><text x="${W - R + 3}" y="${f1(Y(c.ys[c.ys.length - 1]) + 3)}" font-size="8.5" fill="var(--muted)">${c.l}</text>`).join("");
  g += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${f1(X(p.m))} ${f1(Y(p.v))}`).join(" ")}" fill="none" stroke="var(--orange)" stroke-width="2"/>`;
  g += pts.map(p => `<circle cx="${f1(X(p.m))}" cy="${f1(Y(p.v))}" r="3.6" fill="var(--orange)" stroke="var(--card)" stroke-width="1.2"><title>${roDate(p.date)}: ${fmtN(p.v)}</title></circle>`).join("");
  return `<figure class="gchart"><figcaption>${title}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg></figure>`;
}
function growthCharts(s) {
  const sx = s.g === "B" ? 1 : s.g === "F" ? 2 : null; if (!sx || !s.birth) return "";
  const l = bioOf(s.id).map(b => ({ b, m: ageMonths(s.birth, b.date) })).filter(x => x.m !== null && x.m >= 60 && x.m <= 228);
  const hp = l.filter(x => num(x.b.h) > 50).map(x => ({ m: x.m, v: num(x.b.h), date: x.b.date }));
  const bp = l.map(x => ({ m: x.m, v: bioCalc(s, x.b).bmi, date: x.b.date })).filter(p => p.v);
  if (!hp.length && !bp.length) return "";
  return `<div class="gcharts">${hp.length ? growthChart("Înălțimea pentru vârstă (cm)", WHO_REF.hfa[sx], hp) : ""}${bp.length ? growthChart("IMC pentru vârstă (kg/m²)", WHO_REF.bmi[sx], bp) : ""}</div>
    <p class="small muted" style="margin:0 0 6px">Portocaliu: elevul. Banda verde: între P15 și P85; linia verde: P50, mijlocul. Curbe OMS 2007 pentru ${s.g === "F" ? "fete" : "băieți"}.</p>`;
}

   c.ciclu: "prep" (pregătitoare, fără evaluări), "primar" (I–IV, calificative), "gim" (V–VIII, note) */

/* „pregătitoare”, „0” → prep; „a II-a”, „3B” → primar; altfel gim */

/* ---------- module ----------
   e.mod = 0..4 leagă evaluarea de modulul din structura anului; null = evaluare suplimentară */
function modIdxFromName(n) {
  const m = String(n || "").match(/modul(?:ul)?\s+(V|IV|III|II|I|[1-5])\b/i); if (!m) return null;
  const t = m[1].toUpperCase(); return /^\d$/.test(t) ? +t - 1 : ROMAN.indexOf(t);

/* fiecare clasă (în afară de pregătitoare) are cele 5 module; cele lipsă se creează cu probele din Modulul I */
function ensureModules(s, c) {

  const es = s.evals.filter(e => e.classId === c.id);
  const src = es.find(e => e.mod === 0) || es.slice().sort((a, b) => (a.created || 0) - (b.created || 0))[0];
  for (let i = 0; i < 5; i++) {
    if (es.some(e => e.mod === i)) continue;
    s.evals.push({ id: uid(), classId: c.id, name: `Modulul ${ROMAN[i]}`, mod: i, created: Date.now() + i, weights: src && src.weights ? { ...src.weights } : null, closed: false, snap: null,

/* migrarea 5: tipul clasei, modulele, zilele libere, baremul pentru calificative */
function normalize5(s) {
  const st = s.settings;

  s.classes.forEach(c => { if (!CICLU[c.ciclu]) c.ciclu = cicluOf(c.name); });
  s.evals.forEach(e => e.probes.forEach(p => { if (!p.baremQ) p.baremQ = { B: ["", "", ""], F: ["", "", ""] }; if (!p.minQ) p.minQ = "S"; }));
  s.mig = s.mig || {};
  if (!s.mig.mods) {
    s.classes.forEach(c => {
      const used = new Set();
      s.evals.filter(e => e.classId === c.id).sort((a, b) => (a.created || 0) - (b.created || 0)).forEach(e => {
        if (typeof e.mod === "number") { used.add(e.mod); return; }
        const i = modIdxFromName(e.name);
        if (i !== null && i >= 0 && i < 5 && !used.has(i)) { e.mod = i; used.add(i); }

/* ---------- calificative (clasele I–IV) ----------
   probă „barem”: rezultatul r se compară cu p.baremQ[gen] = [prag FB, prag B, prag S]; sub S → p.minQ ("S" sau "I")
   probă „direct”: res.q = calificativul ales; res.r = rezultatul, doar informativ
   e.data[elev].fq = calificativul final, ales de profesor */
const QUAL = ["FB", "B", "S", "I"], QV = { FB: 4, B: 3, S: 2, I: 1 };
const QNAME = { FB: "Foarte bine", B: "Bine", S: "Suficient", I: "Insuficient" };
function probeQual(p, res, gen) {
  res = res || {};

  const r = num(res.r); if (r === null) return null;
  const th = p.baremQ && p.baremQ[gen]; if (!th || !th.some(x => num(x) !== null)) return null;

  return p.minQ === "I" ? "I" : "S";

/* sugestia: calificativul cel mai des întâlnit la probe; la egalitate, cel mai bun */
function suggestQ(list) {
  const qs = list.filter(q => QV[q]); if (!qs.length) return null;
  const cnt = {}; qs.forEach(q => cnt[q] = (cnt[q] || 0) + 1);
  return QUAL.slice().sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0) || QV[b] - QV[a])[0];
}
function studentEvalQ(e, s) {

  const pq = e.probes.map(p => { const r = (d.res || {})[p.id] || {}; return scutit || r.x ? null : probeQual(p, r, s.g); });
  const sug = scutit ? null : suggestQ(pq);
  let Q = scutit ? null : (QV[d.fq] ? d.fq : null);
  if (e.closed && e.snap && e.snap[s.id] && "Q" in e.snap[s.id]) Q = e.snap[s.id].Q;
  return { prim: true, pq, pn: pq.map(() => null), A: null, B: null, C: null, cN: 0, M: null, F: null, Q, sug, scutit };
}

function qHtml(q) { return q ? `<span class="qval q${q}" title="${QNAME[q]}">${q}</span>` : ""; }

/* ===================== LIVRAREA 6 (v1.10): LECȚIA DUPĂ DATĂ · MEDIA ANUALĂ ===================== */

/* ---------- lecția intră la modulul în care îi cade data ----------
   l.evalId se recalculează din dată (la pornire, la schimbarea datei și a structurii anului).
   Fără structura anului completată, lecția rămâne la evaluarea pe care o are (sau la primul modul deschis). */
function modIdxIn(s, iso) {
  const y = schoolYearOf(new Date(iso + "T12:00:00"));
  const mods = ((s.settings.yearMods || {})[y] || []).map((m, i) => ({ ...m, i })).filter(m => m.from && m.to).sort((a, b) => a.to.localeCompare(b.to));
  if (!mods.length) return null;
  for (const m of mods) if (iso <= m.to) return m.i;
  return mods[mods.length - 1].i;
}
function syncLessonEval(l, s = S) {
  const c = s.classes.find(x => x.id === l.classId);
  if (!c || c.ciclu === "prep") { l.evalId = null; return; }
  const es = s.evals.filter(e => e.classId === c.id), i = modIdxIn(s, l.date);
  const m = i === null ? null : es.find(e => e.mod === i);
  if (m) { l.evalId = m.id; return; }
  if (!l.evalId || !es.some(e => e.id === l.evalId)) {
    const open = es.filter(e => !e.closed).sort((a, b) => (modKey(a) - modKey(b)) || ((a.created || 0) - (b.created || 0)));
    l.evalId = open[0] ? open[0].id : null;
  }
}
/* migrarea 6: lecțiile trec la modulul datei; calificativul anual (clasele I–IV) */
function normalize6(s) {
  s.lessons.forEach(l => syncLessonEval(l, s));
  s.students.forEach(x => { if (typeof x.anQ !== "string") x.anQ = ""; });
}

function closeEvalSnap(e) {

  e.closed = true;
}

/* ---------- media anuală ----------
   note: media notelor întregi de pe module, cu două zecimale; modulul în curs intră cu nota de până azi.
   calificative: sugestia = calificativul cel mai des întâlnit pe module; cel anual îl alege profesorul (s.anQ). */
function modEvals(cid) { return evalsOf(cid).filter(e => typeof e.mod === "number"); }
function annualOf(s) {
  const c = cls(s.classId); if (!c || c.ciclu === "prep") return null;
  const prim = c.ciclu === "primar", t = todayISO(), scut = hasScutireAn(s);
  const items = modEvals(c.id).map(e => {
    const r = studentEval(e, s), m = yearMods(c.year)[e.mod] || {};
    return { e, r, v: scut ? null : prim ? r.Q : r.F, cur: !e.closed && !!m.from && !!m.to && t >= m.from && t <= m.to, done: e.closed || (!!m.to && t > m.to) };
  });
  const vals = items.filter(x => x.v !== null && x.v !== undefined);
  const prov = items.some(x => !x.done) || vals.length < items.length;
  if (prim) return { prim, items, n: vals.length, sug: suggestQ(vals.map(x => x.v)), Q: scut ? null : (QV[s.anQ] ? s.anQ : null), prov, scut };

          : prim ? `<td class="calc">${qHtml(a.sug)}</td><td class="fin"><select class="n" data-anq="${s.id}">${qOpts(a.Q)}</select></td>`
          : `<td class="fin ${a.avg !== null && a.avg < 5 ? "low" : ""}">${a.avg === null ? "" : fmt2(a.avg)}${a.avg !== null && a.prov ? `<span class="muted small">*</span>` : ""}</td>`}</tr>`).join("")}</tbody>
      ${prim ? "" : `<tfoot><tr><td></td><td class="stick" style="background:var(--card2)">Media clasei</td>${es.map((e, i) => `<td>${fmt2(mean(A.filter(x => !x.a.scut).map(x => x.a.items[i].v)))}</td>`).join("")}<td>${fmt2(mean(A.filter(x => !x.a.scut).map(x => x.a.avg)))}</td></tr></tfoot>`}
      </table></div>
`
      : `<div class="card empty">Clasa nu are elevi.</div>`}`;
  $$("[data-anq]", v).forEach(sel => sel.onchange = () => { stu(sel.dataset.anq).anQ = QV[sel.value] ? sel.value : ""; save(); });
}
function anualRows(cid) {
  const c = cls(cid), prim = c.ciclu === "primar", es = modEvals(cid);
  return { c, prim, es, rows: studentsOf(cid).map(s => ({ s, a: annualOf(s) })) };
}
ACT.printAnual = el => {
  const { c, prim, es, rows } = anualRows(el.dataset.c);
  let h = printHeader(`Situația anuală – Educație fizică și sport – ${esc(c.name)}`, `${esc(school(c.schoolId)?.name || "")} · ${c.year} · Profesor: ${esc(S.settings.profesor || "")} · ${prim ? "Calificative" : "Media anuală = media notelor de pe module"} · ${new Date().toLocaleDateString("ro-RO")}`);
  h += `<table><thead><tr><th>Nr.</th><th class="l">Nume și prenume</th>${es.map(e => `<th>${esc(e.name)}</th>`).join("")}${prim ? "<th>Sugestie</th><th>Calificativ anual</th>" : "<th>Media anuală</th>"}</tr></thead><tbody>`;
  rows.forEach(({ s, a }, k) => {
    h += `<tr><td>${k + 1}</td><td class="l">${esc(s.name)}</td>${a.items.map(x => `<td>${a.scut ? "–" : x.v ?? ""}</td>`).join("")}`;
    h += a.scut ? `<td colspan="${prim ? 2 : 1}">scutit medical</td>` : prim ? `<td>${a.sug || ""}</td><td><b>${a.Q || ""}</b></td>` : `<td><b>${a.avg === null ? "" : fmt2(a.avg)}${a.avg !== null && a.prov ? "*" : ""}</b></td>`;
    h += `</tr>`;
  });
  h += `</tbody></table>${prim ? "" : `<p style="font-size:10px">* medie provizorie</p>`}<p style="margin-top:30px">Profesor: ${esc(S.settings.profesor || "____________________")} &nbsp;&nbsp;&nbsp; Semnătura: ____________________</p>`;
  doPrint(h, true);
};
ACT.csvAnual = el => {
  const { c, prim, es, rows } = anualRows(el.dataset.c);
  const head = ["Nr", "Nume", "Scutit", ...es.map(e => e.name), ...(prim ? ["Sugestie", "Calificativ anual"] : ["Media anuală", "Provizorie"])];
  const q = v => { v = v === null || v === undefined ? "" : String(v); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const out = rows.map(({ s, a }, k) => [k + 1, s.name, a.scut ? "da" : "", ...a.items.map(x => a.scut ? "" : x.v ?? ""),
    ...(prim ? [a.scut ? "" : a.sug || "", a.scut ? "" : a.Q || ""] : [a.scut || a.avg === null ? "" : fmt2(a.avg), a.scut || a.avg === null ? "" : a.prov ? "da" : "nu"])]);
  download(new Blob(["﻿" + [head, ...out].map(r => r.map(q).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" }), `catalog-EFS-${c.name.replace(/\s+/g, "_")}-situatia-anuala-${c.year}.csv`);
};

/* ===================== LIVRAREA 7 (v1.11): 💡 EXPLICAȚII · ▶ LECȚIE DIN ORAR ===================== */

/* butonul 💡 deschide explicația în loc de textele lungi de pe ecran */
function tipBtn(k, x) { return `<button type="button" class="tipbtn" data-act="tip" data-k="${k}" data-x="${esc(x)}" title="Explicații" aria-label="Explicații">💡</button>`; }
const TIPS = {
  lectie: x => {
    const [cid, lid] = x.split("|"), c = cls(cid), l = lesson(lid), gim = classGim(cid);
    return ["Lecția", `<p>Apasă <b>Absent</b> sau <b>Învoit</b> la cei care lipsesc. Pentru o abatere apasă ⚠️.</p>
      ${gim ? `<p><b>Comportament (C)</b>: fără cartonaș = <b>10</b>, 🟨 = 8, 🟧 = 6, 🟥 = 4. Dacă un elev primește mai multe cartonașe, la lecția asta contează cel mai grav.</p>
        <p>Nota C de la fiecare lecție intră la modulul în care cade data lecției. Dacă schimbi data, se schimbă și modulul.</p>`
        : `<p>Cartonașele 🟨 🟧 🟥 rămân în istoricul elevului, dar nu intră în ${c && c.ciclu === "prep" ? "nicio evaluare" : "calificativ"}.</p>`}
      <p>${l && l.v !== 2 && gim ? "Lecție din versiunea veche: contează notele date atunci și cartonașele noi; cei fără notă nu primesc 10." : "Lecția se păstrează când apeși „Gata”, pui o absență sau dai un cartonaș."}</p>`];
  },
  eval: x => ["Evaluarea", `<p>Nota finală se calculează din <b>A</b> (probele motrice), <b>B</b> (cunoștințele, verificate oral sau scris) și <b>C</b> (comportamentul), după formula de sus.</p>
    <p><b>B</b> poate avea mai multe note. B este media lor, rotunjită, și intră mereu în medie. Elevul fără nicio notă B are media calculată doar din A și C. Butonul „🗣️ B – oral” schimbă în „B – scris”.</p>
    <p><b>C</b> = media notelor de la ore și a notelor C puse de mână cu „+” (fiecare cât o oră), rotunjită. Notele C de mână contează doar la acest modul.</p>
    <p><b>⭐ NL</b> (notă la lecție) se dă din ecranul Lecție, cu butonul ⭐. Intră în A ca o probă care contează doar la elevii care au NL.</p>
    <p>„🗂️ Carduri” arată fiecare elev cu probele una sub alta; „▦ Tabel” arată toată clasa pe rânduri (pe telefon, probele stau una sub alta în celula elevului). Din „Proba A” poți vedea doar o probă; Nota A rămâne media tuturor probelor.</p>
    <p><b>C</b> este media lecțiilor din perioada modulului: fără cartonaș = 10, 🟨 8, 🟧 6, 🟥 4 (la o lecție contează cel mai grav). Cartonașele se dau din pagina clasei, cu <a href="#/clasa/${esc(x)}" data-x>▶ Lecție</a>.</p>
    <p>Nu e nevoie să închizi modulul. Îl închizi doar dacă vrei să fixezi notele; la trecerea în anul următor se închid automat.</p>`],
  evalq: () => ["Evaluarea cu calificative", `<p>La probele cu barem, calificativul se dă din rezultat. La celelalte îl alegi direct.</p>
    <p><b>Calificativul final</b> îl alegi tu. Sugestia aplicației este calificativul cel mai des întâlnit la probe (la egalitate, cel mai bun).</p>
    <p>Cartonașele nu intră în calificativ.</p>`],
  rapid: () => ["Introducere rapidă", `<p>Alege sus ce notezi, apoi treci prin listă. <b>Enter</b> = elevul următor.</p>
    <p>La calificativul final, butonul cu chenar punctat este sugestia aplicației.</p>`],
  anual: () => ["Situația anuală", `<p><b>Media anuală</b> = media notelor întregi de pe module, afișată cu două zecimale.</p>
    <p>Modulul în curs (colorat albastru) intră cu nota de până azi. Un modul intră în medie doar dacă nota lui se poate calcula, adică după ce sunt trecute probele.</p>
    <p><b>*</b> = medie provizorie: anul nu s-a încheiat sau lipsesc note pe unele module.</p>`],
  anualq: () => ["Situația anuală", `<p>Calificativul anual îl alegi tu. Sugestia este calificativul cel mai des întâlnit pe module (la egalitate, cel mai bun).</p>
    <p>Modulul în curs (colorat albastru) intră cu calificativul de până azi.</p>`]
};
ACT.tip = el => { const t = TIPS[el.dataset.k]; if (!t) return; const [title, html] = t(el.dataset.x || ""); modal(`💡 ${title}`, `<div class="tips">${html}</div>`, `<button class="btn" data-x>Am înțeles</button>`); };

/* ▶ Lecție din meniul de jos: clasa care e acum în orar, apoi următoarea, apoi ultima de azi */
function orarTargetNow() {
  const dow = new Date().getDay(), t = todayISO();
  if (dow < 1 || dow > 5 || freeDayOf(t) || inVacation(t)) return null;
  const list = orarDay(dow); if (!list.length) return null;
  const now = nowHM();
  return list.find(x => now >= x.sl.start && now <= x.sl.end) || list.find(x => now < x.sl.start) || list[list.length - 1];
}
function vLectieNow(v) {
  const x = orarTargetNow();
  if (!x) {
    const anySet = orarAnySet();
    goReplace("#/panou"); window.scrollTo(0, 0);
    toast(anySet ? "Nu ai lecție azi în orar. Deschide clasa din Panou sau din Clase." : "Completează orarul (Mai mult → Orar), ca ▶ Lecție să deschidă clasa potrivită.", 4500);
    return;
  }
  openLessons(x.cs.map(c => c.id), true);
}

/* ===================== LIVRAREA 8 (v1.12): CLASE SIMULTANE ===================== */

/* orarul: grid["zi-oră"] = [idClasă, ...] (înainte era un singur id) */
function normalize7(s) {
  const G = s.settings.orar.grid;
  Object.keys(G).forEach(k => {
    const v = Array.isArray(G[k]) ? G[k] : G[k] ? [G[k]] : [];
    G[k] = [...new Set(v.filter(Boolean))]; if (!G[k].length) delete G[k];
  });
}
/* migrarea 8: B are mai multe note (d.bs) și tip (e.bType); nota B veche (d.b) devine prima notă din listă */
function normalize8(s) {
  s.evals.forEach(e => {
    if (e.bType !== "scris") e.bType = "oral";
    Object.values(e.data || {}).forEach(d => {
      if (!d || typeof d !== "object") return;
      if (!Array.isArray(d.bs)) d.bs = [];
      if ("b" in d) { if (num(d.b) !== null) d.bs.unshift({ v: String(num(d.b)), d: d.bd || "" }); delete d.b; delete d.bd; }
    });
  });
}
/* migrarea 9: note C de mână (d.cs) la evaluare; ⭐ NL la lecție (l.nl) */
function normalize9(s) {
  s.evals.forEach(e => Object.values(e.data || {}).forEach(d => { if (d && typeof d === "object" && !Array.isArray(d.cs)) d.cs = []; }));
  s.lessons.forEach(l => { if (!l.nl || typeof l.nl !== "object") l.nl = {}; });
}
function cellIds(k) { const v = S.settings.orar.grid[k]; return Array.isArray(v) ? v : v ? [v] : []; }
function cellClasses(k) { return cellIds(k).map(cls).filter(Boolean); }
function orarAnySet() { return Object.keys(S.settings.orar.grid).some(k => cellClasses(k).length); }
ACT.orarDel = el => { const G = S.settings.orar.grid, k = el.dataset.cell; G[k] = cellIds(k).filter(x => x !== el.dataset.c); if (!G[k].length) delete G[k]; save(); render(); };

/* deschide lecția de azi pentru una sau mai multe clase (simultane) */
function openLessons(cids, replace) {
  const cs = cids.map(cls).filter(Boolean); if (!cs.length) return;
  const c0 = cs[0];
  if (S.activeSchool !== c0.schoolId || S.activeYear !== c0.year) { S.activeSchool = c0.schoolId; S.activeYear = c0.year; save(); }
  const first = todayLesson(c0.id); if (!first) { if (replace) goReplace(`#/clasa/${c0.id}`); return; }
  const ls = [first, ...cs.slice(1).map(c => todayLesson(c.id, true))];
  const h = ls.length === 1 ? `#/clasa/${c0.id}/ora/${first.id}` : `#/grup/${ls.map(l => l.id).join(",")}`;
  if (replace) { goReplace(h); window.scrollTo(0, 0); } else go(h);
}

/* lecția comună: elevii fiecărei clase, sub titlul clasei; datele se salvează separat, la lecția fiecărei clase */
function grupStats(ls) {
  const per = ls.map(l => { const st = studentsOf(l.classId); return { c: cls(l.classId), n: st.length, p: st.filter(s => !attOf(l, s.id)).length, k: st.reduce((a, s) => a + lessonCards(l, s.id).length, 0) }; });
  const P = per.reduce((a, x) => a + x.p, 0), N = per.reduce((a, x) => a + x.n, 0), K = per.reduce((a, x) => a + x.k, 0);
  return `<b>${P}/${N}</b> prezenți <span class="muted small">(${per.map(x => `${esc(x.c ? x.c.name : "")} ${x.p}/${x.n}`).join(" · ")})</span> · <b>${K}</b> ${K === 1 ? "cartonaș" : "cartonașe"}`;
}
function vGrup(v, ids) {
  const ls = String(ids || "").split(",").map(lesson).filter(l => l && cls(l.classId));
  if (!ls.length) return go("#/panou");
  if (ls.length === 1) return goReplace(`#/clasa/${ls[0].classId}/ora/${ls[0].id}`);
  const date = ls[0].date, names = ls.map(l => cls(l.classId).name);
  const fd = freeDayOf(date);
  v.innerHTML = `
    <a href="#/panou" class="backbtn" aria-label="Înapoi" data-act="grupDone" data-ls="${ls.map(l => l.id).join(",")}"><b>←</b><span>Panou</span></a>
    <div class="row between"><h1>Lecția – ${names.map(esc).join(" + ")}</h1><span class="row">${tipBtn("grup", ls.map(l => l.classId + "|" + l.id).join(","))}<span class="badge b-ok">${roDate(date)}</span></span></div>
    <div class="card"><label class="f">Data (pentru toate clasele)<input type="date" id="gDate" value="${date}"></label>
      ${fd ? `<div class="alert warn" style="margin:0"><span>🎈</span><span class="t">${roDate(date)} este zi liberă${fd.name ? `: ${esc(fd.name)}` : ""}.</span></div>` : ""}</div>
    ${ls.map(l => { const c = cls(l.classId), e = ev(l.evalId), locked = e && e.closed, gim = classGim(c.id);
      return `<div class="grphd"><h2>${esc(c.name)}</h2><span class="muted small">${c.ciclu === "prep" ? "pregătitoare" : `${e ? esc(e.name) : "—"}${gim ? " · nota C" : ""}`}</span></div>
        ${locked ? `<div class="alert warn"><span>🔒</span><span class="t">Evaluarea „${esc(e.name)}” este închisă. Cartonașele nu se mai pot modifica, doar prezența.</span></div>` : ""}
        <div class="scards">${studentsOf(c.id).map(s => oraCard(s, l, e, locked)).join("") || `<div class="card empty">Clasa nu are elevi.</div>`}</div>`; }).join("")}
    <div class="stickybar row between">
      <span>${grupStats(ls)}</span>
      <span class="row"><button class="btn sm ghost" data-act="grupDelete" data-ls="${ls.map(l => l.id).join(",")}">🗑</button>
      <a class="btn sm" href="#/panou" data-act="grupDone" data-ls="${ls.map(l => l.id).join(",")}">Gata</a></span>
    </div>`;
  $("#gDate").onchange = ev2 => {
    if (!ev2.target.value) return;
    ls.forEach(l => { l.date = ev2.target.value; syncLessonEval(l); });
    save(); render(); toast(`Lecția comună a trecut pe ${roDate(ev2.target.value)}.`);
  };
}
ACT.grupDone = el => { el.dataset.ls.split(",").map(lesson).filter(Boolean).forEach(l => l.ok = true); save(); go("#/panou"); };
ACT.grupDelete = el => {
  const ls = el.dataset.ls.split(",").map(lesson).filter(Boolean);
  if (!confirmBox(`Ștergi lecția din ${roDate(ls[0].date)} la toate clasele (${ls.map(l => cls(l.classId).name).join(", ")}), cu absențele și cartonașele de la ea?`)) return;
  const ids = new Set(ls.map(l => l.id)); S.lessons = S.lessons.filter(x => !ids.has(x.id)); save(); go("#/panou");
};
TIPS.grup = x => {
  const anyGim = x.split(",").some(p => classGim(p.split("|")[0]));
  return ["Lecția comună (clase simultane)", `<p>Elevii sunt grupați pe clase. Absențele, învoirile și cartonașele se salvează la clasa fiecărui elev, deci notele, mediile și situația anuală rămân separate.</p>
    ${anyGim ? `<p><b>Comportament (C)</b> la clasele cu note: fără cartonaș = <b>10</b>, 🟨 = 8, 🟧 = 6, 🟥 = 4. La clasele cu calificative, cartonașele rămân doar în istoric.</p>` : ""}
    <p>Fiecare clasă intră la modulul în care cade data. Data se schimbă o dată pentru toate clasele.</p>
    <p>Ora apare comună pentru că în orar ai pus mai multe clase în aceeași oră.</p>`];
};

/* ===================== PORNIRE ===================== */
async function boot() {
  try { await loadState(); } catch (e) { if (!S) S = blankState(); }
  shell();
  render();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
boot();

</script>
